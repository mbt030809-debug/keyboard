name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Commit APK to dist
        run: |
          B=$(grep '^build=' app/version.properties | cut -d= -f2)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mbt-keyboard-b${B}-20261124.apk"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "dist/mbt-keyboard-b${B}-20261124.apk"
          git commit -m "dist: mbt-keyboard-b${B}-20261124.apk [skip ci]" || true
          git push

      - name: Rename APK with date suffix
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/mbt-keyboard-debug-$(date +%Y%m%d).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mbt-keyboard-debug-apk
          path: out/*.apk u

      - name: Publish latest release (update button download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(grep '^build=' app/version.properties | cut -d= -f2)
          cp app/build/outputs/apk/debug/app-debug.apk out/mbt-keyboard-latest.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest out/mbt-keyboard-latest.apk \
            --target "${GITHUB_SHA}" --title "MBT Keyboard b${B}" --notes "build ${B}"
